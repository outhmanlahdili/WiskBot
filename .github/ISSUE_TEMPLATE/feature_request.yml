name: Feature request
description: Suggest an idea or improvement for WiskBot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please keep the idea focused on WiskBot's local-first, BYOK model.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches have you considered, and why were they rejected?
    validations:
      required: false

  - type: dropdown
    id: local_first_fit
    attributes:
      label: Does it fit the local-first / BYOK model?
      description: WiskBot has no WiskBot subscription, no account, no server, no telemetry, and keys stay on the user's device. Does this idea respect those principles?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
